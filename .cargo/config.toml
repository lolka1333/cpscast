# Target: the RV6699's Broadcom MIPS - MIPS32r1, BIG-endian, SOFT-float
# (busybox ELF e_flags 0x50001007, Tag_GNU_MIPS_ABI_FP=3). Debian's
# gcc-mips-linux-gnu emits MIPS32r2 + hard-float and the result dies with
# "Illegal instruction" on this chip; that is the wall the dropbear build hit.
#
# Use the BUILT-IN `mips-unknown-linux-musl` target rather than a hand-written
# .json: the libc crate keys its cfgs off the triple, and a custom name like
# "mips-unknown-linux-muslsf" makes it fail to compile. The built-in spec is
# already big-endian and already carries +soft-float; the only mismatch is the
# ISA level, so downgrade r2 -> r1 with a target-feature flag.
[target.mips-unknown-linux-musl]
linker = "mips-linux-muslsf-gcc"
# target-cpu=mips32 is a first-class option here (rustc --print target-cpus lists
# it); the built-in target defaults to mips32r2, which would emit r2-only
# instructions this chip does not have. Verified against the router's own
# busybox: e_flags 0x50001007 -> arch bits 0x50000000 = MIPS32 (r1), soft-float
# bit set.
#
# -Cpanic=immediate-abort: std for a musl target links `-lunwind`, and a
# musl-cross-make toolchain ships the unwinder as libgcc_eh.a instead, so the
# link fails with "cannot find -lunwind". We do not want unwinding at all
# (panic = "abort"), and immediate-abort drops the unwinder from std itself.
# It needs -Zunstable-options; the old build-std-features="panic_immediate_abort"
# spelling was removed in current nightlies.
# target-cpu=mips32 ALONE IS NOT ENOUGH: the built-in spec hardcodes
# features = "+mips32r2,+soft-float", target-cpu does not clear it, and the
# first CI build came out as ELF flags 0x70001007 (mips32r2) while the router's
# own busybox is 0x50001007 (MIPS32 r1). r2-only instructions fault on this
# chip - that is the "Illegal instruction" wall the dropbear build hit. So the
# feature has to be switched off explicitly. rustc warns that mips32/mips32r2
# are "unknown and unstable" features; it still passes them to LLVM, which is
# what matters, and the workflow asserts the resulting ELF flags.
rustflags = [
  "-C", "target-cpu=mips32",
  "-C", "target-feature=+crt-static,-mips32r2,+mips32",
  "-C", "link-self-contained=no",
  "-Z", "unstable-options",
  "-C", "panic=immediate-abort",
]

[unstable]
# Tier-3 target: core/std are not shipped, so they are compiled from source.
# Needs a nightly toolchain plus `rustup component add rust-src --toolchain nightly`.
build-std = ["std", "panic_abort"]

[build]
target = "mips-unknown-linux-musl"
